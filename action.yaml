name: EC Validate
description: GitHub Action developed by Conforma (formerly Enterprise Contract), designed to assess container images for security & compliance.
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  image:
    description: The image reference
    required: true

  key:
    description: The public key for verifying signatures
    required: false

  policy:
    description: A policy configuration file which determines what policies are to be applied
    required: false

  identity:
    description: A regexp string used to match the certificate identity associated with the image
    required: false

  issuer:
    description: The OIDC issuer for validation
    required: false

  extra-params:
    description: This is to add some extra arguments into ec.
    required: false

runs:
  using: composite

  steps:
    - name: Validate inputs
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        KEY: ${{ inputs.key }}
        POLICY: ${{ inputs.policy }}
        IDENTITY: ${{ inputs.identity }}
        ISSUER: ${{ inputs.issuer }}
        EXTRA_PARAMS: ${{ inputs.extra-params }}
      run: |
        set -euo pipefail

        for name in IMAGE KEY POLICY IDENTITY ISSUER EXTRA_PARAMS; do
          value="${!name}"
          case "$value" in
            *'"'*|*'`'*|*'$('*|*'\\'*|*$'\n'*|*$'\r'*)
              echo "${name} contains unsupported shell control characters" >&2
              exit 1
              ;;
          esac
        done

        read -r -a extra_args <<< "$EXTRA_PARAMS"
        for arg in "${extra_args[@]}"; do
          case "$arg" in
            --policy|--policy=*|--image|--image=*|--public-key|--public-key=*|\
            --certificate-identity*|--certificate-oidc-issuer*|--output*)
              echo "EXTRA_PARAMS cannot override validation inputs or outputs" >&2
              exit 1
              ;;
          esac
        done

    - name: Run EC Validate
      uses: docker://quay.io/conforma/cli:snapshot@sha256:14357c193aa18cc2e6038ae69f92a299d19d06a3ccade6d92a849ea904736239
      id: ec_validate
      continue-on-error: true
      with:
        args: >
          validate image
          --policy "${{ inputs.policy }}"
          --image "${{ inputs.image }}"
          --public-key "${{ inputs.key }}"
          --certificate-identity-regexp "${{ inputs.identity }}"
          --certificate-oidc-issuer "${{ inputs.issuer }}"
          ${{ inputs.extra-params }}
          --output yaml
          --output summary-markdown=log.md 
    
    - name: Output summary
      run: cat log.md >> $GITHUB_STEP_SUMMARY
      shell: bash

    - name: Fail if validate failed
      if: steps.ec_validate.outcome != 'success'
      run: exit 1
      shell: bash 
